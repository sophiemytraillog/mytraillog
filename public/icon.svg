<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Cream background -->
  <rect width="256" height="256" rx="48" fill="#FAF8F5"/>

  <!-- Mountain silhouette: left peak, valley, taller right (main) peak -->
  <path d="M 28 214 L 86 94 L 120 126 L 162 52 L 228 214 Z" fill="#C4652A"/>

  <!-- Trail path winding up the right peak -->
  <path d="M 198 210 Q 180 130 162 52"
        stroke="#FAF8F5" stroke-width="10" stroke-linecap="round"
        fill="none"/>

  <!-- Summit marker -->
  <circle cx="162" cy="52" r="11" fill="#FAF8F5"/>
</svg>
